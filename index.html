    R=Math.min(16,Math.max(5.8,7.6/cam.aspect));draw();
  }
  function step(){var d=tg-t;if(Math.abs(d)<0.02){t=tg;anim=false;draw();return;}t+=(d>0?1:-1)*0.03;draw();requestAnimationFrame(step);}
  function go(x){
    tg=x;
    document.getElementById('bOpen').setAttribute('aria-pressed',x?'false':'true');
    document.getElementById('bClose').setAttribute('aria-pressed',x?'true':'false');
    if(reduce){t=tg;draw();return;}
    if(!anim){anim=true;requestAnimationFrame(step);}
  }
  document.getElementById('bOpen').addEventListener('click',function(){go(0);});
  document.getElementById('bClose').addEventListener('click',function(){go(1);});
  document.querySelectorAll('[data-plan]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-plan');if(location.hash!=='#'+id)location.hash=id;else build(id);});});
  document.querySelectorAll('[data-view]').forEach(function(b){b.addEventListener('click',function(){var a=b.getAttribute('data-view').split(',');th=parseFloat(a[0]);ph=parseFloat(a[1]);draw();});});
  var dr=false,lx=0,ly=0;
  stage.addEventListener('pointerdown',function(e){dr=true;lx=e.clientX;ly=e.clientY;try{stage.setPointerCapture(e.pointerId);}catch(err){}stage.style.cursor='grabbing';});
  stage.addEventListener('pointermove',function(e){if(!dr)return;th-=(e.clientX-lx)*0.008;ph+=(e.clientY-ly)*0.006;th=Math.max(-1.5,Math.min(1.55,th));ph=Math.max(0.02,Math.min(1.3,ph));lx=e.clientX;ly=e.clientY;draw();});
  function up(){dr=false;stage.style.cursor='grab';}
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  function route(){var id=(location.hash||'').replace('#','');build('plan-3');}
  window.addEventListener('hashchange',route);
  window.addEventListener('resize',size);
  cw=stage.clientWidth||680;ch=stage.clientHeight||460;
  ren.setSize(cw,ch);cam.aspect=cw/ch;cam.updateProjectionMatrix();
  R=Math.min(16,Math.max(5.8,7.6/cam.aspect));
  go(0);route();
})();
</script>
</body>
</html>
